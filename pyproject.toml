[project]
name = "ai-development"
version = "0.1.0"
description = "Sync tooling for the ai-development repo"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["poethepoet>=0.29"]

[tool.uv]
package = false

[tool.poe.tasks.sync]
cmd = "python tooling/sync.py copy"
help = "Copy skills to Claude Code, Tabnine and opencode skill locations"

[tool.poe.tasks.sync-link]
cmd = "python tooling/sync.py link"
help = "Symlink skills instead of copying - edits in this repo apply live"
